<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Εκτύπωση μενού</title>
<style>
@page{size:A4;margin:12mm 12mm 14mm;@bottom-center{content:counter(page);font:8pt system-ui,sans-serif;color:#777}}@page tents{size:A4;margin:0}*{box-sizing:border-box}
:root{--sea:#103c46;--gold:#d7ad63;--ink:#19353a;--muted:#657371}
body{margin:0;color:var(--ink);font:10pt/1.35 Georgia,"Times New Roman",serif;background:#eef0ed}
.bar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:12px;background:var(--sea);font-family:system-ui,sans-serif}
.hint{color:#d8e6e3;font:12px system-ui,sans-serif;max-width:340px}.warn{background:#fff3cd;color:#664d03;border-radius:9px;padding:7px 11px;font:600 12px system-ui,sans-serif}.bar button,.bar a{background:#fffefa;color:var(--sea);border:0;border-radius:9px;padding:9px 15px;font:600 14px system-ui;text-decoration:none;cursor:pointer}.print-filter{display:flex;align-items:center;gap:7px;color:#fff;font:600 12px system-ui}.print-filter select{max-width:220px;min-width:150px;min-height:38px;border:1px solid #ffffff55;border-radius:9px;padding:6px;background:#fffefa;color:var(--sea);font:13px system-ui}.cat.print-hidden{display:none!important}
.sheet{background:#fffefa;max-width:210mm;margin:16px auto;padding:13mm;min-height:297mm;box-shadow:0 8px 32px #0001;page-break-after:always;break-after:page}.sheet:last-child{page-break-after:auto;break-after:auto}
.top{text-align:center;border-bottom:2pt solid var(--gold);padding-bottom:5mm;margin-bottom:6mm}
.eyebrow{font:700 8pt system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#9a7841}
.top h1{margin:2mm 0;font-size:30pt;color:var(--sea)}.top p{margin:1mm 0;color:#444}.top .ad{font:9pt system-ui,sans-serif;color:var(--muted);margin-top:2mm}
.cols{column-count:2;column-gap:10mm}.cat{margin-bottom:5mm}
.cat h2{font-size:13pt;color:var(--sea);margin:0 0 2mm;border-bottom:1pt solid var(--gold);padding-bottom:1mm;break-after:avoid}
.it{margin-bottom:2.3mm;break-inside:avoid}.row{display:flex;align-items:baseline;gap:5px}.row b{font-weight:700}.dots{flex:1;border-bottom:1pt dotted #aaa;transform:translateY(-3px)}.pr{font-weight:700;white-space:nowrap}.off .pr{text-decoration:line-through;color:#777}
en{font-size:8pt;color:var(--muted);font-style:italic;margin:0}.ds{font-size:8pt;color:#555;margin:1mm 0 0} .allergen{font:7pt system-ui,sans-serif;color:#8a5d24;margin-top:1mm}.allergen span{display:inline-block;border:0.5pt solid #d9c69f;border-radius:2mm;padding:.4mm 1.2mm;margin:.3mm}
.allergen-sheet{font-family:system-ui,-apple-system,sans-serif}.allergen-sheet .top{margin-bottom:9mm}.allergen-sheet .allergen-intro{font-size:10pt;color:#555;max-width:175mm;margin:0 auto}.allergen-sheet .allergen-list{list-style:none;counter-reset:allergen;margin:12mm 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:5mm 12mm}.allergen-sheet .allergen-list li{counter-increment:allergen;position:relative;padding:0 0 4mm 11mm;border-bottom:.5pt solid #e4dfd2;font:9.5pt/1.4 system-ui,sans-serif;break-inside:avoid}.allergen-sheet .allergen-list li:before{content:counter(allergen);position:absolute;left:0;top:0;width:7mm;height:7mm;border-radius:50%;background:#f4ead6;color:#76521b;display:flex;align-items:center;justify-content:center;font:700 9pt system-ui,sans-serif}.allergen-sheet .allergen-note{margin:12mm 0 0;padding:5mm;border:1pt solid #e4dfd2;border-radius:2mm;color:#5d6967;font:9pt/1.5 system-ui,sans-serif}.allergen-sheet .foot{margin-top:12mm}@media(max-width:700px){.allergen-sheet .allergen-list{grid-template-columns:1fr}}
.foot{display:flex;align-items:center;gap:5mm;margin-top:6mm;padding-top:3mm;border-top:1pt solid #ccc;font:8pt system-ui,sans-serif}.heritage-line{text-align:center;max-width:165mm;margin:7mm auto 0;color:var(--sea);font:italic 10pt/1.5 Georgia,serif}.foot img{width:22mm;height:22mm}
.poster{text-align:center;padding-top:22mm;font-family:system-ui,sans-serif}.poster h1{font:700 34pt Georgia,serif;color:var(--sea);margin:0 0 4mm}.poster img{width:115mm;height:115mm}.poster p{font-size:17pt;margin:4mm 0}.poster i{color:#666;font-size:12pt}
.tent-sheet{page:tents;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);gap:2mm 3mm;background:#fffefa;width:210mm;height:297mm;margin:12px auto;padding:7mm;page-break-after:always;break-after:page;box-shadow:0 8px 32px #0001}.tent-sheet:last-child{page-break-after:auto;break-after:auto}.tent{height:50mm;border:1px dashed #9b9b92;text-align:center;padding:1mm 2mm;font-family:system-ui,sans-serif;display:grid;grid-template-rows:1fr 1fr;min-height:0;overflow:hidden}.tent-face{display:flex;align-items:center;justify-content:space-around;gap:2mm;min-height:0}.tent-face.back{transform:rotate(180deg);border-top:1px dashed #b7a98e}.tent-copy{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}.tent h2{margin:0;font:700 9pt Georgia,serif;color:var(--sea);line-height:1.05}.tent .table-no{font:800 8pt system-ui;color:#8a682f;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.5mm}.tent img{width:18mm;height:18mm;object-fit:contain}.tent p{margin:.5mm 0 0;font-size:7pt}.tent i{color:#666;font-size:6pt}@media print{.tent-sheet{margin:0;box-shadow:none}}
@media print{body{background:#fff}.bar{display:none}.sheet{margin:0;padding:0;max-width:none;min-height:0;box-shadow:none}.cat.print-hidden{display:none!important}}
</style>
</head>
<body>
<div class="bar"><button onclick="window.print()">Εκτύπωση / Αποθήκευση PDF</button><label class="print-filter">Γλώσσα PDF <select id="print-language" aria-label="Επιλογή γλώσσας PDF"><option value="el">Ελληνικά</option><option value="en">English</option><option value="bg">Български</option><option value="tr">Türkçe</option><option value="all">Ενιαίο PDF · Και οι 4 γλώσσες</option></select></label><label class="print-filter" id="filter-wrap" hidden>Κατηγορίες <select id="print-categories" multiple aria-label="Επιλογή κατηγοριών για εκτύπωση" title="Κράτησε πατημένο Ctrl ή Command για πολλαπλή επιλογή"><option value="*" selected>Όλες οι κατηγορίες</option></select></label><span class="hint" id="pdf-hint">Ενιαίο PDF: 4 ξεχωριστές ενότητες, με μενού και αλλεργιογόνα σε κάθε γλώσσα.</span><span class="warn" id="missing" hidden></span><a href="/print">Μενού</a><a href="/print?mode=qr">Κάρτα QR</a><a href="/print?mode=tents">50 Table QR Cards</a><a href="/admin">Πίσω στη διαχείριση</a></div>
<div class="sheet" id="r"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ALLERGEN_LEGEND={"el":{"title":"ΕΝΗΜΕΡΩΣΗ ΓΙΑ ΤΑ ΑΛΛΕΡΓΙΟΓΟΝΑ","intro":"Σύμφωνα με τον Κανονισμό (ΕΕ) 1169/2011, τα πιάτα ενδέχεται να περιέχουν ή να έχουν παρασκευαστεί με τα παρακάτω αλλεργιογόνα:","items":["Δημητριακά που περιέχουν γλουτένη (σιτάρι, κριθάρι)","Καρκινοειδή (γαρίδες, καραβίδες)","Αυγά","Ψάρια (γαύρος, σαρδέλα, μπαρμπούνι κ.ά.)","Αραχίδες (φιστίκια)","Σόγια","Γάλα και λακτόζη (φέτα, κεφαλοτύρι, κασέρι, κρέμες)","Καρποί με κέλυφος (ξηροί καρποί)","Σέλινο","Μουστάρδα","Σησάμι","Διοξείδιο του θείου και θειώδη (κρασιά, ούζο)","Λούπινο","Μαλάκια (χταπόδι, καλαμάρι, σουπιά, μύδια)"],"note":"Η παρούσα λίστα είναι γενική ενημέρωση και δεν υποκαθιστά την αναλυτική ενημέρωση για τα αλλεργιογόνα κάθε πιάτου. Για πληροφορίες σχετικά με συγκεκριμένο πιάτο, παρακαλούμε απευθυνθείτε στο προσωπικό."},"en":{"title":"ALLERGEN INFORMATION","intro":"Under Regulation (EU) No 1169/2011, dishes may contain or be prepared with the following allergens:","items":["Cereals containing gluten (wheat, barley)","Crustaceans (shrimp, crayfish)","Eggs","Fish (anchovy, sardine, red mullet, etc.)","Peanuts","Soybeans","Milk and lactose (feta, kefalotyri, kasseri, creams)","Tree nuts","Celery","Mustard","Sesame","Sulphur dioxide and sulphites (wines, ouzo)","Lupin","Molluscs (octopus, squid, cuttlefish, mussels)"],"note":"This list is for general information and does not replace the specific allergen information for each dish. For details about a particular dish, please ask our staff."},"bg":{"title":"ИНФОРМАЦИЯ ЗА АЛЕРГЕНИТЕ","intro":"Съгласно Регламент (ЕС) № 1169/2011 ястията може да съдържат или да са приготвени със следните алергени:","items":["Зърнени култури, съдържащи глутен (пшеница, ечемик)","Ракообразни (скариди, речни раци)","Яйца","Риба (хамсия, сардина, барбуня и др.)","Фъстъци","Соя","Мляко и лактоза (фета, кефалотири, касери, сметана)","Ядки","Целина","Горчица","Сусам","Серен диоксид и сулфити (вина, узо)","Лупина","Мекотели (октопод, калмари, сепия, миди)"],"note":"Този списък е с обща информационна цел и не замества конкретната информация за алергените във всяко ястие. За подробности относно определено ястие, моля, обърнете се към персонала."},"tr":{"title":"ALERJEN BİLGİLENDİRMESİ","intro":"(AB) 1169/2011 sayılı Tüzük uyarınca yemekler aşağıdaki alerjenleri içerebilir veya bunlarla hazırlanmış olabilir:","items":["Gluten içeren tahıllar (buğday, arpa)","Kabuklular (karides, kerevit)","Yumurta","Balık (hamsi, sardalya, barbun vb.)","Yer fıstığı","Soya","Süt ve laktoz (feta, kefalotyri, kasseri, kremalar)","Sert kabuklu yemişler","Kereviz","Hardal","Susam","Kükürt dioksit ve sülfitler (şaraplar, uzo)","Acı bakla","Yumuşakçalar (ahtapot, kalamar, sübye, midye)"],"note":"Bu liste genel bilgilendirme amaçlıdır ve her yemeğe ait özel alerjen bilgisinin yerine geçmez. Belirli bir yemek hakkında ayrıntı için lütfen personelimize danışın."}};
const HERITAGE={"el":"40 χρόνια με εκλεκτές γεύσεις στη Μάκρη Έβρου, δίπλα στο κύμα, τιμούμε την παράδοση και τη θάλασσα με αγάπη και μεράκι.","en":"For 40 years, with exceptional flavors in Makri, Evros, right by the sea, we have honored tradition and the sea with love and passion.","bg":"Вече 40 години предлагаме изискани вкусове в Макри, Еврос, край морския бряг, като с любов и старание почитаме традицията и морето.","tr":"40 yıldır Evros'un Makri kasabasında, denizin hemen kıyısında, seçkin lezzetlerimizle geleneğe ve denize sevgi ve özveriyle değer veriyoruz."};
const ALLERGENS={gluten:['Δημητριακά με γλουτένη','Cereals containing gluten','Зърнени култури с глутен','Gluten içeren tahıllar'],crustaceans:['Καρκινοειδή','Crustaceans','Ракообразни','Kabuklular'],eggs:['Αυγά','Eggs','Яйца','Yumurta'],fish:['Ψάρια','Fish','Риба','Balık'],peanuts:['Αραχίδες','Peanuts','Фъстъци','Yer fıstığı'],soybeans:['Σόγια','Soybeans','Соя','Soya'],milk:['Γάλα','Milk','Мляко','Süt'],nuts:['Καρποί με κέλυφος','Tree nuts','Ядки','Sert kabuklu yemişler'],celery:['Σέλινο','Celery','Целина','Kereviz'],mustard:['Μουστάρδα','Mustard','Горчица','Hardal'],sesame:['Σησάμι','Sesame','Сусам','Susam'],sulphites:['Διοξείδιο θείου / θειώδη','Sulphites','Сулфити','Sülfitler'],lupin:['Λούπινο','Lupin','Лупина','Acı bakla'],molluscs:['Μαλάκια','Molluscs','Мекотели','Yumuşakçalar']};
const safeUrl=s=>{if(!String(s||'').trim())return '';try{const u=new URL(String(s||''),location.origin);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}};
const LANGS={el:{scan:'Σκανάρετε για το μενού',menu:'Ψηφιακό μενού',allergens:'Αλλεργιογόνα',footerLabel:'Πληροφορίες',section:'ΕΛΛΗΝΙΚΑ'},en:{scan:'Scan for the menu',menu:'Digital menu',allergens:'Allergens',footerLabel:'Information',section:'ENGLISH'},bg:{scan:'Сканирайте за менюто',menu:'Дигитално меню',allergens:'Алергени',footerLabel:'Информация',section:'БЪЛГАРСКИ'},tr:{scan:'Menüyü görüntülemek için tarayın',menu:'Dijital menü',allergens:'Alerjenler',footerLabel:'Bilgi',section:'TÜRKÇE'}};
const params=new URLSearchParams(location.search),mode=params.get('mode');
const requestedLang=params.get('lang')||'el';
const validLang=['el','en','bg','tr','all'].includes(requestedLang)?requestedLang:'el';
const languagePicker=document.querySelector('#print-language');
if(languagePicker) languagePicker.value=validLang;
const value=(obj,key,lang)=>lang==='el'?(obj[key]||''):(obj[key+'_'+lang]||obj[key+'_en']||obj[key]||'');
fetch('/api/menu',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(({settings:s,categories:cs})=>{
 document.title=s.name+' — Εκτύπωση PDF';
 if(!mode){cs=cs.map(c=>({...c,items:c.items.filter(i=>i.available)})).filter(c=>c.items.length)}
 if(mode==='qr'){r.innerHTML='<div class="poster"><h1>'+esc(s.name)+'</h1><img src="/qr.svg" alt="QR code"><p>Σκανάρετε για το μενού<br><i>Scan for the menu</i><br><i>Сканирайте за менюто</i><br><i>Menüyü görüntülemek için tarayın</i></p></div>';return}
 if(mode==='tents'){
   const total=50,perPage=10,pages=Math.ceil(total/perPage);
   const sheets=Array.from({length:pages},(_,page)=>{
     const cards=Array.from({length:perPage},(_,slot)=>{
       const table=page*perPage+slot+1,src='/qr.svg?table='+encodeURIComponent(String(table));
       const face='<div class="tent-face"><img src="'+src+'" alt="QR τραπεζιού '+table+'"><div class="tent-copy"><div class="table-no">ΤΡΑΠΕΖΙ '+String(table).padStart(2,'0')+' · TABLE '+String(table).padStart(2,'0')+'</div><h2>'+esc(s.name)+'</h2><p>Σκανάρετε για το μενού · Scan for the menu</p><i>Сканирайте за менюто · Menüyü okutun</i></div></div>';
       return '<div class="tent">'+face+face.replace('class="tent-face"','class="tent-face back"')+'</div>';
     }).join('');
     return '<div class="tent-sheet">'+cards+'</div>';
   }).join('');
   r.innerHTML=sheets;document.title=s.name+' — 50 Foldable QR Table Tents';return
 }
 const langs=validLang==='all'?['el','en','bg','tr']:[validLang];
 {const names={en:'English',bg:'Български',tr:'Türkçe'},out=[];
  langs.filter(l=>l!=='el').forEach(l=>{let n=0;cs.forEach(c=>{if(!c['name_'+l])n++;c.items.forEach(i=>{if(!i['name_'+l]||(i.description&&!i['description_'+l]))n++})});if(n)out.push(names[l]+': '+n)});
  const w=document.querySelector('#missing');if(w&&out.length){w.hidden=false;w.textContent='Λείπουν μεταφράσεις — '+out.join(' · ')+' (συμπληρώστε τες στη Διαχείριση → Μεταφράσεις)'}}
 const price=p=>Number(p)>0?Number(p).toFixed(2).replace('.',',')+' '+esc(s.currency):'';
 const menuHtml=(lang,position)=> {
   const L=LANGS[lang];
   const content=cs.map(c=>'<div class="cat"><h2>'+esc(value(c,'name',lang))+'</h2>'+
     c.items.map(i=>{let codes=[];try{codes=JSON.parse(i.allergen_codes||'[]')}catch{};const labels=codes.map(code=>ALLERGENS[code]?.[['el','en','bg','tr'].indexOf(lang)]).filter(Boolean);const freeAllergens=value(i,'allergens',lang);return '<div class="it">'+'<div class="row"><b>'+esc(value(i,'name',lang))+'</b><span class="dots"></span><span class="pr">'+price(i.price)+'</span></div>'+(value(i,'description',lang)?'<p class="ds">'+esc(value(i,'description',lang))+'</p>':'')+((labels.length||freeAllergens)?'<div class="allergen">'+esc(L.allergens)+': '+labels.map(x=>'<span>'+esc(x)+'</span>').join(' ')+(freeAllergens?' '+esc(freeAllergens):'')+'</div>':'')+'</div>'}).join('')+'</div>').join('');
   const tagline=value(s,'tagline',lang),footer=value(s,'footer',lang);
   const menuPage='<section class="sheet language-section" data-language="'+lang+'"><div class="top"><div class="eyebrow">'+esc(L.menu)+' · '+esc(L.section)+'</div><h1>'+esc(s.name)+'</h1><p>'+esc(tagline)+'</p><div class="ad">'+esc(s.address)+'</div></div><div class="cols">'+content+'</div><div class="foot"><img src="/qr.svg" alt="QR code"><div><b>'+esc(L.menu)+'</b><br>'+esc(footer)+'</div></div><p class="heritage-line">'+esc(HERITAGE[lang]||HERITAGE.el)+'</p></section>';
   return menuPage+'<section class="sheet allergen-sheet language-section" data-language="'+lang+'"><div class="top"><div class="eyebrow">'+esc(L.allergens)+' · '+esc(L.section)+'</div><h1>'+esc(s.name)+'</h1><p class="allergen-intro">'+esc(ALLERGEN_LEGEND[lang].intro)+'</p></div><ol class="allergen-list">'+ALLERGEN_LEGEND[lang].items.map(item=>'<li>'+esc(item)+'</li>').join('')+'</ol><p class="allergen-note">'+esc(ALLERGEN_LEGEND[lang].note)+'</p><p class="heritage-line">'+esc(HERITAGE[lang]||HERITAGE.el)+'</p></section>';
 };
 r.innerHTML=langs.map(menuHtml).join('');
 const picker=document.querySelector('#print-categories');
 if(picker){
   const labels=cs.map((cat,index)=>'<option value="'+index+'">'+esc(value(cat,'name','el'))+'</option>').join('');
   picker.innerHTML='<option value="*" selected>Όλες οι κατηγορίες</option>'+labels;
   document.querySelector('#filter-wrap').hidden=false;
   picker.addEventListener('change',()=>{
     const chosen=[...picker.selectedOptions].map(o=>o.value),all=chosen.includes('*')||!chosen.length;
     document.querySelectorAll('.cols').forEach(cols=>[...cols.querySelectorAll('.cat')].forEach((el,index)=>el.classList.toggle('print-hidden',!all&&!chosen.includes(String(index)))));
     if(all)picker.value='*';else [...picker.options].find(o=>o.value==='*').selected=false;
   });
 }
}).catch(()=>{r.innerHTML='<p>Δεν ήταν δυνατή η φόρτωση του μενού.</p>'});
if(languagePicker) languagePicker.addEventListener('change',()=>{const next=new URL(location.href);if(languagePicker.value==='el')next.searchParams.delete('lang');else next.searchParams.set('lang',languagePicker.value);location.href=next.toString()});
</script>
</body></html>
