<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Εκτύπωση μενού</title>
<style>
@page{size:A4;margin:0}*{box-sizing:border-box}
:root{--sea:#103c46;--gold:#d7ad63;--ink:#19353a;--muted:#657371}
body{margin:0;color:var(--ink);font:10pt/1.35 Georgia,"Times New Roman",serif;background:#eef0ed}
.bar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:12px;background:var(--sea);font-family:system-ui,sans-serif}
.bar button,.bar a{background:#fffefa;color:var(--sea);border:0;border-radius:9px;padding:9px 15px;font:600 14px system-ui;text-decoration:none;cursor:pointer}.print-filter{display:flex;align-items:center;gap:7px;color:#fff;font:600 12px system-ui}.print-filter select{max-width:220px;min-width:150px;min-height:38px;border:1px solid #ffffff55;border-radius:9px;padding:6px;background:#fffefa;color:var(--sea);font:13px system-ui}.cat.print-hidden{display:none!important}
.sheet{background:#fffefa;max-width:210mm;margin:16px auto;padding:13mm;min-height:297mm;box-shadow:0 8px 32px #0001}
.top{text-align:center;border-bottom:2pt solid var(--gold);padding-bottom:5mm;margin-bottom:6mm}
.eyebrow{font:700 8pt system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#9a7841}
.top h1{margin:2mm 0;font-size:30pt;color:var(--sea)}.top p{margin:1mm 0;color:#444}.top .ad{font:9pt system-ui,sans-serif;color:var(--muted);margin-top:2mm}
.cols{column-count:2;column-gap:10mm}.cat{margin-bottom:5mm;break-inside:avoid}
.cat h2{font-size:13pt;color:var(--sea);margin:0 0 2mm;border-bottom:1pt solid var(--gold);padding-bottom:1mm;break-after:avoid}
.it{margin-bottom:2.3mm;break-inside:avoid}.row{display:flex;align-items:baseline;gap:5px}.row b{font-weight:700}.dots{flex:1;border-bottom:1pt dotted #aaa;transform:translateY(-3px)}.pr{font-weight:700;white-space:nowrap}.off .pr{text-decoration:line-through;color:#777}
.foodphoto{float:right;width:22mm;height:22mm;object-fit:cover;margin:0 0 2mm 3mm;border-radius:2mm;print-color-adjust:exact}.en{font-size:8pt;color:var(--muted);font-style:italic;margin:0}.ds{font-size:8pt;color:#555;margin:1mm 0 0} .allergen{font:7pt system-ui,sans-serif;color:#8a5d24;margin-top:1mm}.allergen span{display:inline-block;border:0.5pt solid #d9c69f;border-radius:2mm;padding:.4mm 1.2mm;margin:.3mm}
.foot{display:flex;align-items:center;gap:5mm;margin-top:6mm;padding-top:3mm;border-top:1pt solid #ccc;font:8pt system-ui,sans-serif}.foot img{width:22mm;height:22mm}
.poster{text-align:center;padding-top:22mm;font-family:system-ui,sans-serif}.poster h1{font:700 34pt Georgia,serif;color:var(--sea);margin:0 0 4mm}.poster img{width:115mm;height:115mm}.poster p{font-size:17pt;margin:4mm 0}.poster i{color:#666;font-size:12pt}
.tent-sheet{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);gap:2mm 3mm;background:#fffefa;width:210mm;height:297mm;margin:12px auto;padding:7mm;page-break-after:always;break-after:page;box-shadow:0 8px 32px #0001}.tent-sheet:last-child{page-break-after:auto;break-after:auto}.tent{height:50mm;border:1px dashed #9b9b92;text-align:center;padding:1mm 2mm;font-family:system-ui,sans-serif;display:grid;grid-template-rows:1fr 1fr;min-height:0;overflow:hidden}.tent-face{display:flex;align-items:center;justify-content:space-around;gap:2mm;min-height:0}.tent-face.back{transform:rotate(180deg);border-top:1px dashed #b7a98e}.tent-copy{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}.tent h2{margin:0;font:700 9pt Georgia,serif;color:var(--sea);line-height:1.05}.tent .table-no{font:800 8pt system-ui;color:#8a682f;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.5mm}.tent img{width:18mm;height:18mm;object-fit:contain}.tent p{margin:.5mm 0 0;font-size:7pt}.tent i{color:#666;font-size:6pt}@media print{.tent-sheet{margin:0;box-shadow:none}}
@media print{body{background:#fff}.bar{display:none}.sheet{margin:0;padding:0;max-width:none;min-height:0;box-shadow:none}.cat.print-hidden{display:none!important}}
</style>
</head>
<body>
<div class="bar"><button onclick="window.print()">Εκτύπωση / Αποθήκευση PDF</button><label class="print-filter" id="filter-wrap" hidden>Κατηγορίες <select id="print-categories" multiple aria-label="Επιλογή κατηγοριών για εκτύπωση" title="Κράτησε πατημένο Ctrl ή Command για πολλαπλή επιλογή"><option value="*" selected>Όλες οι κατηγορίες</option></select></label><a href="/print">Μενού</a><a href="/print?mode=qr">Κάρτα QR</a><a href="/print?mode=tents">50 Table QR Cards</a><a href="/admin">Πίσω στη διαχείριση</a></div>
<div class="sheet" id="r"></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ALLERGENS={gluten:['Δημητριακά με γλουτένη','Cereals containing gluten','Зърнени култури с глутен','Gluten içeren tahıllar'],crustaceans:['Καρκινοειδή','Crustaceans','Ракообразни','Kabuklular'],eggs:['Αυγά','Eggs','Яйца','Yumurta'],fish:['Ψάρια','Fish','Риба','Balık'],peanuts:['Αραχίδες','Peanuts','Фъстъци','Yer fıstığı'],soybeans:['Σόγια','Soybeans','Соя','Soya'],milk:['Γάλα','Milk','Мляко','Süt'],nuts:['Καρποί με κέλυφος','Tree nuts','Ядки','Sert kabuklu yemişler'],celery:['Σέλινο','Celery','Целина','Kereviz'],mustard:['Μουστάρδα','Mustard','Горчица','Hardal'],sesame:['Σησάμι','Sesame','Сусам','Susam'],sulphites:['Διοξείδιο θείου / θειώδη','Sulphites','Сулфити','Sülfitler'],lupin:['Λούπινο','Lupin','Лупина','Acı bakla'],molluscs:['Μαλάκια','Molluscs','Мекотели','Yumuşakçalar']};
const safeUrl=s=>{try{const u=new URL(String(s||''),location.origin);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}};
const LANGS={el:{scan:'Σκανάρετε για το μενού',menu:'Ψηφιακό μενού',allergens:'Αλλεργιογόνα'},en:{scan:'Scan for the menu',menu:'Digital menu',allergens:'Allergens'},bg:{scan:'Сканирайте за менюто',menu:'Дигитално меню',allergens:'Алергени'},tr:{scan:'Menüyü görüntülemek için tarayın',menu:'Dijital menü',allergens:'Alerjenler'}};
const lang=new URLSearchParams(location.search).get('lang')||'el',L=LANGS[lang]||LANGS.el;
const value=(obj,key)=>obj[key+'_'+lang]||obj[key+'_en']||obj[key]||'';

fetch('/api/menu',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(({settings:s,categories:cs})=>{
 document.title=s.name+' — Εκτύπωση';const mode=new URLSearchParams(location.search).get('mode');
 const scan='<p>'+L.scan+'</p>';
 if(mode==='qr'){r.innerHTML='<div class="poster"><h1>'+esc(s.name)+'</h1><img src="/qr.svg" alt="QR code"><p>Σκανάρετε για το μενού<br><i>Scan for the menu</i></p></div>';return}
 if(mode==='tents'){
   const total=50,perPage=10,pages=Math.ceil(total/perPage);
   const sheets=Array.from({length:pages},(_,page)=>{
     const cards=Array.from({length:perPage},(_,slot)=>{
       const table=page*perPage+slot+1,src='/qr.svg?table='+encodeURIComponent(String(table));
       const face='<div class="tent-face"><img src="'+src+'" alt="QR τραπεζιού '+table+'"><div class="tent-copy"><div class="table-no">TABLE '+String(table).padStart(2,'0')+'</div><h2>'+esc(s.name)+'</h2><p>Scan for menu · Сканирайте · Menü için tarayın</p></div></div>';
       return '<div class="tent">'+face+face.replace('class="tent-face"','class="tent-face back"')+'</div>';
     }).join('');
     return '<div class="tent-sheet">'+cards+'</div>';
   }).join('');
   r.innerHTML=sheets;document.title=s.name+' — 50 Foldable QR Table Tents';return
 }
 const price=p=>Number(p)>0?Number(p).toFixed(2).replace('.',',')+' '+esc(s.currency):'';
 r.innerHTML='<div class="top"><div class="eyebrow">'+esc(L.menu)+'</div><h1>'+esc(s.name)+'</h1><p>'+esc(value(s,'tagline'))+'</p><div class="ad">'+esc(s.address)+'</div></div><div class="cols">'+
 cs.map(c=>'<div class="cat"><h2>'+esc(value(c,'name'))+'</h2>'+
 c.items.map(i=>{let codes=[];try{codes=JSON.parse(i.allergen_codes||'[]')}catch{};const labels=codes.map(code=>ALLERGENS[code]?.[['el','en','bg','tr'].indexOf(lang)]).filter(Boolean);return '<div class="it '+(i.available?'':'off')+'>'+(safeUrl(i.image_url)?'<img class="foodphoto" src="'+esc(safeUrl(i.image_url))+'" alt="">':'')+'<div class="row"><b>'+esc(value(i,'name'))+'</b><span class="dots"></span><span class="pr">'+price(i.price)+'</span></div>'+(value(i,'description')?'<p class="ds">'+esc(value(i,'description'))+'</p>':'')+((labels.length||i['allergens_'+lang]||i.allergens)?'<div class="allergen">'+esc(L.allergens)+': '+labels.map(x=>'<span>'+esc(x)+'</span>').join(' ')+((i['allergens_'+lang]||i.allergens)?' '+esc(i['allergens_'+lang]||i.allergens):'')+'</div>':'')+'</div>'}).join('')+'</div>').join('')+
 '</div><div class="foot"><img src="/qr.svg" alt="QR code"><div><b>Ψηφιακό μενού / Digital menu</b><br>'+esc(s.footer)+'<br><i>'+esc(s.footer_en)+'</i></div></div>';
 const picker=document.querySelector('#print-categories');
 if(picker){
   picker.innerHTML='<option value="*" selected>Όλες οι κατηγορίες</option>'+cs.map((cat,index)=>'<option value="'+index+'">'+esc(cat.name)+'</option>').join('');
   document.querySelector('#filter-wrap').hidden=false;
   picker.addEventListener('change',()=>{
     const chosen=[...picker.selectedOptions].map(o=>o.value);
     const all=chosen.includes('*')||!chosen.length;
     [...document.querySelectorAll('.cols .cat')].forEach((el,index)=>el.classList.toggle('print-hidden',!all&&!chosen.includes(String(index))));
     if(all)picker.value='*';
     else [...picker.options].find(o=>o.value==='*').selected=false;
   });
 }
}).catch(()=>{r.innerHTML='<p>Δεν ήταν δυνατή η φόρτωση του μενού.</p>'});
</script>
</body></html>
