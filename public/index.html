<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#103c46">
<meta name="description" content="Ψηφιακός κατάλογος με πιάτα, περιγραφές και τιμές.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="/">
<meta property="og:type" content="website">
<meta property="og:title" content="Ψηφιακό Μενού">
<meta property="og:description" content="Δείτε τον κατάλογο, τα πιάτα και τις τιμές μας.">
<title>Ψηφιακό Μενού</title>
<style>
:root{color-scheme:light;--ink:#19353a;--sea:#103c46;--sea2:#1b5960;--gold:#d7ad63;--paper:#f6f4ee;--card:#fffefa;--muted:#697a79;--line:#e4e2d8;--red:#a64232}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at 50% -35%,#37777b 0%,transparent 55%),linear-gradient(135deg,#0c3038,#1b5960 68%,#16434a);color:#fff;padding:54px 20px 42px;text-align:center;border-bottom:4px solid var(--gold)}
header:after{content:"";position:absolute;width:260px;height:260px;border:1px solid #ffffff18;border-radius:50%;right:-80px;top:-130px;box-shadow:0 0 0 24px #ffffff08,0 0 0 50px #ffffff05;pointer-events:none}
.brand{position:relative;z-index:1;max-width:800px;margin:auto}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:#f1d7a7}
h1{font:700 clamp(36px,8vw,60px)/1.04 Georgia,"Times New Roman",serif;letter-spacing:-.035em;margin:12px 0 8px}
header p{margin:0;color:#e5efed;font-size:15px}header .brand{animation:brand-in .45s ease-out}@keyframes brand-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.ad{margin-top:12px;font-size:13px;color:#c8d8d5}.table-context{display:inline-flex;margin-top:12px;padding:5px 12px;border:1px solid #ffffff55;border-radius:99px;background:#ffffff12;color:#f4dfb9;font-size:12px;font-weight:750}
.lang{position:absolute;z-index:2;top:14px;right:14px;display:flex;padding:3px;border:1px solid #ffffff55;border-radius:99px;background:#ffffff12}
.lang button{border:0;border-radius:99px;background:transparent;color:#fff;padding:6px 10px;font:700 12px system-ui;cursor:pointer}.lang button.on{background:var(--gold);color:#233033}
.controls{position:sticky;top:0;z-index:10;background:#f6f4eef2;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:12px max(16px,calc((100% - 1080px)/2))}
.search{max-width:1080px;margin:auto;position:relative}.search input{width:100%;border:1px solid #d9ded8;background:#fffefa;border-radius:14px;padding:13px 16px;font:inherit;color:var(--ink);outline:none}.search input:focus{border-color:var(--sea2);box-shadow:0 0 0 3px #1b596018}.filter-row{display:flex;align-items:center;gap:10px;max-width:1080px;margin:8px auto 0;font-size:12px;color:var(--muted)}.filter-row label{display:flex;align-items:center;gap:7px}.filter-row input{accent-color:var(--sea2);width:16px;height:16px}.popular-tag{display:inline-flex;align-items:center;border-radius:99px;background:#f6ead1;color:#76521b;padding:3px 8px;font-size:10px;font-weight:800;margin-top:7px}.allergen-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.allergen-chip{display:inline-flex;border:1px solid #ead9b9;border-radius:6px;padding:2px 6px;font-size:10px;color:#805a26;background:#fff9ed}
nav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 0 1px}nav::-webkit-scrollbar{display:none}nav a{flex:none;padding:7px 13px;border:1px solid #d2d9d4;border-radius:99px;color:var(--sea);text-decoration:none;font-size:13px;font-weight:650;white-space:nowrap;background:#fffefa}nav a:focus-visible,nav a:hover{background:var(--sea);color:#fff;outline:none;border-color:var(--sea);box-shadow:0 3px 10px #103c4622}nav a:active{transform:scale(.98)}
main{max-width:1080px;margin:0 auto;padding:12px 18px 44px}.intro{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:20px 0 6px}.intro h2{font:700 24px Georgia,serif;margin:0;color:var(--sea)}.intro p{font-size:12px;color:var(--muted);margin:0}
section{scroll-margin-top:150px;padding-top:24px}.cathead{display:flex;align-items:center;gap:12px;margin:0 0 14px}.cathead:after{content:"";height:1px;background:var(--gold);flex:1}.cathead h2{font:700 27px/1.1 Georgia,serif;color:var(--sea);margin:0;letter-spacing:-.02em}.cathead small{font:500 13px system-ui;color:var(--muted);display:block;margin-top:4px}
 .items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.item{display:flex;min-height:142px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 4px 16px #19353a08;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}.item:hover{transform:translateY(-2px);box-shadow:0 9px 24px #19353a12;border-color:#d4c49f}.photo{width:148px;min-width:148px;object-fit:cover;background:#e9e5db}.details{padding:15px 16px;min-width:0;flex:1}.itemtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.name{font-weight:750;font-size:16px;line-height:1.3}.price{color:var(--sea);font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}.en{font-size:12px;color:var(--muted);margin-top:3px}.desc{font-size:13px;color:#657371;margin:7px 0 0;white-space:pre-line}.allergens{font-size:11px;color:#855b22;margin-top:8px}.allergens b{font-weight:750}.off{opacity:.68}.off .name{text-decoration:line-through;text-decoration-color:#b1b7b2}.tag{display:inline-block;font-size:10px;color:var(--red);font-weight:750;margin-top:6px;text-transform:uppercase;letter-spacing:.04em}
.empty,.msg{text-align:center;color:var(--muted);padding:36px 18px}.empty{background:#fffefa;border:1px dashed var(--line);border-radius:14px}
footer{text-align:center;padding:24px 18px 38px;color:var(--muted);font-size:12px}footer .line{width:48px;height:2px;background:var(--gold);margin:0 auto 12px}footer .allergen-note{max-width:760px;margin:12px auto 0;font-size:11px;color:#80643c}
@media(max-width:700px){header{padding:54px 16px 30px}.controls{padding:10px 12px}.items{grid-template-columns:1fr;gap:9px}.item{display:flex;min-height:108px}.photo{width:112px;min-width:112px;min-height:108px}.details{padding:13px}.name{font-size:15px}.price{font-size:14px}.cathead h2{font-size:24px}main{padding:8px 12px 30px}.intro{align-items:start;flex-direction:column;gap:2px}section{scroll-margin-top:145px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.brand,.item{animation:none;transition:none}.item:hover{transform:none}}
</style>
</head>
<body>
<header><div class="lang" aria-label="Language"><button data-l="el" aria-label="Ελληνικά">EL</button><button data-l="en" aria-label="English">EN</button><button data-l="bg" aria-label="Български">BG</button><button data-l="tr" aria-label="Türkçe">TR</button></div>
<div class="brand"><div class="eyebrow" id="eyebrow">Ψηφιακός κατάλογος</div><h1 id="n">Μενού</h1><p id="t"></p><div class="ad" id="a"></div><div class="table-context" id="table-context" hidden></div></div></header>
<div class="controls"><div class="search"><input id="q" type="search" autocomplete="off" placeholder="Αναζήτηση πιάτου…" aria-label="Αναζήτηση πιάτου"></div><div class="filter-row"><label><input id="available-only" type="checkbox"> <span id="available-label">Μόνο διαθέσιμα</span></label></div><nav id="nav" aria-label="Κατηγορίες"></nav></div>
<main><div class="intro"><h2 id="heading">Ο κατάλογός μας</h2><p id="count"></p></div><div id="m"><p class="msg">Φόρτωση μενού…</p></div></main>
<footer><div class="line"></div><div id="f"></div><p class="allergen-note" id="allergen-note"></p></footer>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T={
el:{off:'Εξαντλήθηκε',empty:'Δεν βρέθηκαν πιάτα.',err:'Δεν φορτώθηκε το μενού. Ανανεώστε τη σελίδα.',cats:'Κατηγορίες',search:'Αναζήτηση πιάτου…',heading:'Ο κατάλογός μας',items:'πιάτα',allergens:'Αλλεργιογόνα:',available:'Μόνο διαθέσιμα',popular:'Δημοφιλές',allergenNote:'Παρακαλούμε ενημερώστε μας για τυχόν αλλεργίες. Παρά τη φροντίδα μας, ενδέχεται να υπάρχει επιμόλυνση κατά την προετοιμασία.',table:'Τραπέζι',eyebrow:'Ψηφιακός κατάλογος'},
en:{off:'Unavailable',empty:'No dishes found.',err:'The menu could not be loaded. Please refresh.',cats:'Categories',search:'Search dishes…',heading:'Our menu',items:'items',allergens:'Allergens:',available:'Available only',popular:'Popular',allergenNote:'Please inform us of any allergies. Despite our care, cross-contact may occur during food preparation.',table:'Table',eyebrow:'Digital menu'},
bg:{off:'Изчерпано',empty:'Няма намерени ястия.',err:'Менюто не може да бъде заредено. Обновете страницата.',cats:'Категории',search:'Търсене на ястие…',heading:'Нашето меню',items:'ястия',allergens:'Алергени:',available:'Само налични',popular:'Популярно',allergenNote:'Моля, уведомете ни за всякакви алергии. Въпреки грижата ни е възможен кръстосан контакт при приготвянето.',table:'Маса',eyebrow:'Дигитално меню'},
tr:{off:'Tükendi',empty:'Yemek bulunamadı.',err:'Menü yüklenemedi. Lütfen sayfayı yenileyin.',cats:'Kategoriler',search:'Yemek ara…',heading:'Menümüz',items:'ürün',allergens:'Alerjenler:',available:'Yalnızca mevcut olanlar',popular:'Popüler',allergenNote:'Lütfen alerjilerinizi bize bildirin. Tüm önlemlere rağmen hazırlık sırasında çapraz bulaşma olabilir.',table:'Masa',eyebrow:'Dijital menü'}
}
let lang='el',M=null;
const ALLERGENS={gluten:['Δημητριακά με γλουτένη','Cereals containing gluten','Зърнени култури с глутен','Gluten içeren tahıllar'],crustaceans:['Καρκινοειδή','Crustaceans','Ракообразни','Kabuklular'],eggs:['Αυγά','Eggs','Яйца','Yumurta'],fish:['Ψάρια','Fish','Риба','Balık'],peanuts:['Αραχίδες','Peanuts','Фъстъци','Yer fıstığı'],soybeans:['Σόγια','Soybeans','Соя','Soya'],milk:['Γάλα','Milk','Мляко','Süt'],nuts:['Καρποί με κέλυφος','Tree nuts','Ядки','Sert kabuklu yemişler'],celery:['Σέλινο','Celery','Целина','Kereviz'],mustard:['Μουστάρδα','Mustard','Горчица','Hardal'],sesame:['Σησάμι','Sesame','Сусам','Susam'],sulphites:['Διοξείδιο θείου / θειώδη','Sulphites','Сулфити','Sülfitler'],lupin:['Λούπινο','Lupin','Лупина','Acı bakla'],molluscs:['Μαλάκια','Molluscs','Мекотели','Yumuşakçalar']};
try{lang=localStorage.getItem('lang')||(['el','en','bg','tr'].includes((navigator.language||'').slice(0,2))?(navigator.language||'').slice(0,2):'en')}catch(e){} if(!T[lang])lang='el';
function draw(){
 if(!M)return;const {settings:s,categories:cs}=M,tr=T[lang]||T.el,q=$('#q').value.trim().toLocaleLowerCase(lang),availableOnly=$('#available-only').checked;
 document.documentElement.lang=lang;document.title=s.name+' | Ψηφιακό Μενού';const canonical=document.querySelector('link[rel=canonical]');if(canonical)canonical.href=location.origin+location.pathname;const ogTitle=document.querySelector('meta[property="og:title"]');if(ogTitle)ogTitle.content=s.name+' | Ψηφιακό Μενού';const ogDesc=document.querySelector('meta[property="og:description"]');if(ogDesc)ogDesc.content=(s.tagline||'Ψηφιακός κατάλογος με πιάτα και τιμές.')+' '+(s.address||'');$('#eyebrow').textContent=tr.eyebrow;$('#available-label').textContent=tr.available;$('#allergen-note').textContent=tr.allergenNote;const table=new URLSearchParams(location.search).get('table');$('#table-context').hidden=!table;$('#table-context').textContent=table?tr.table+': '+table:'';$('#n').textContent=s.name;$('#t').textContent=(s['tagline_'+lang]||s.tagline||'');$('#a').textContent=s.address||'';$('#f').textContent=(s['footer_'+lang]||s.footer||'');$('#heading').textContent=tr.heading;$('#q').placeholder=tr.search;
 document.querySelectorAll('.lang button').forEach(b=>{b.classList.toggle('on',b.dataset.l===lang);b.setAttribute('aria-pressed',String(b.dataset.l===lang))});
 const nm=(el,e,bg,t)=>esc(({en:e,bg,tr:t}[lang])||e||el),safeUrl=v=>{try{const u=new URL(String(v||''),location.origin);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}},price=p=>Number(p)>0?Number(p).toFixed(2).replace('.',',')+' '+esc(s.currency):'';
 const visible=cs.map(c=>({...c,items:c.items.filter(i=>{const text=[i.name,i.name_en,i.name_bg,i.name_tr,i.description,i.description_en,i.description_bg,i.description_tr,i.allergens,i.allergens_en,i.allergens_bg,i.allergens_tr].join(' ').toLocaleLowerCase();return (!q||text.includes(q))&&(!availableOnly||!!i.available)})})).filter(c=>c.items.length);
 $('#nav').setAttribute('aria-label',tr.cats);
 $('#nav').innerHTML=visible.map(c=>'<a href="#c'+c.id+'">'+nm(c.name,c.name_en,c.name_bg,c.name_tr)+'</a>').join('');
 const total=visible.reduce((n,c)=>n+c.items.length,0);$('#count').textContent=total+' '+tr.items;
 if(!total){$('#nav').innerHTML='';$('#m').innerHTML='<div class="empty">'+(q?tr.empty:tr.empty)+'</div>';return}
 $('#m').innerHTML=visible.map(c=>'<section id="c'+c.id+'"><div class="cathead"><div><h2>'+nm(c.name,c.name_en)+'</h2>'+(lang!=='el'?'<small>'+esc(c.name)+'</small>':'')+'</div></div><div class="items">'+c.items.map(i=>{
 const desc=i['description_'+lang]||i.description,allergens=i['allergens_'+lang]||i.allergens;let codes=[];try{codes=JSON.parse(i.allergen_codes||'[]')}catch{};const allergenLabels=codes.map(code=>ALLERGENS[code]?.[['el','en','bg','tr'].indexOf(lang)]).filter(Boolean);
 const photo=safeUrl(i.image_url); return '<article class="item '+(i.available?'':'off')+'">'+(photo?'<img class="photo" src="'+esc(photo)+'" alt="'+esc(nm(i.name,i.name_en,i.name_bg,i.name_tr))+'" loading="lazy" decoding="async" onerror="this.remove()">':'')+'<div class="details"><div class="itemtop"><div class="name">'+nm(i.name,i.name_en)+'</div><div class="price">'+price(i.price)+'</div></div>'+(lang!=='el'?'<div class="en">'+esc(i.name)+'</div>':'')+(desc?'<p class="desc">'+esc(desc)+'</p>':'')+(i.popular?'<div><span class="popular-tag">'+tr.popular+'</span></div>':'')+((allergenLabels.length||allergens)?'<div class="allergens"><b>'+tr.allergens+'</b><div class="allergen-list">'+allergenLabels.map(x=>'<span class="allergen-chip">'+esc(x)+'</span>').join('')+(allergens?'<span class="allergen-chip">'+esc(allergens)+'</span>':'')+'</div></div>':'')+(!i.available?'<div class="tag">'+tr.off+'</div>':'')+'</div></article>';
 }).join('')+'</div></section>').join('');
}
$('#q').addEventListener('input',draw);$('#available-only').addEventListener('change',draw);
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.l;try{localStorage.setItem('lang',lang)}catch(e){}draw()}));
fetch('/api/menu',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(j=>{M=j;draw();try{if(!sessionStorage.getItem('v')){sessionStorage.setItem('v','1');fetch('/api/view',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lang})})}}catch(e){}}).catch(()=>{$('#m').innerHTML='<p class="msg">'+T[lang].err+'</p>'});
</script>
</body>
</html>
